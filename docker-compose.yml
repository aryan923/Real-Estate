services:
  # PHP Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propdesk-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  # Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: propdesk-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Database (MySQL)
  mysql:
    image: mysql:8.4
    container_name: propdesk-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-33066}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-Real_estate}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - propdesk-db-data:/var/lib/mysql

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: propdesk-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: "${DB_USERNAME:-root}"
      PMA_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      - mysql

volumes:
  propdesk-db-data:
    driver: local
