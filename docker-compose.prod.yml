services:
  # PHP Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: propdesk-app-prod
    restart: always
    working_dir: /var/www/html
    volumes:
      - propdesk-app-code:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql

  # Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: propdesk-web-prod
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - propdesk-app-code:/var/www/html:ro
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Database (MySQL)
  mysql:
    image: mysql:8.4
    container_name: propdesk-mysql-prod
    restart: always
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - propdesk-db-data-prod:/var/lib/mysql

volumes:
  propdesk-app-code:
  propdesk-db-data-prod:
